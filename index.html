</style><header><h1>EPS Challenge</h1><p>Jouer · progresser · faire réussir</p></header><main><div id="app"></div><dialog id="validationConfirmation" class="confirmation-dialog" aria-labelledby="confirmationTitle"><div class="confirmation-head"><div class="confirmation-icon" aria-hidden="true">✓</div><h2 id="confirmationTitle">Défi validé !</h2><p>Réussite enregistrée · Vos statistiques</p></div><div id="confirmationDetails" class="confirmation-body"></div><div class="confirmation-footer"><button type="button" class="primary" id="confirmationDone" onclick="finishConfirmation()">Fermer · Élève suivant</button><small>Tu peux retourner jouer.</small></div></dialog><footer>Version 2.11 · Données stockées sur cet appareil uniquement. Effectuer des sauvegardes régulières. Utiliser des identifiants pseudonymisés.</footer></main><script>
const $=id=>document.getElementById(id), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const medals=['—','🥉 Bronze','🥈 Argent','🥇 Or'];
const seed=[['Placement sous le ballon','À deux : lancer en cloche, se déplacer et réceptionner au-dessus du front. Alterner les rôles.','5 réceptions sans déplacement','5 réceptions avec déplacement latéral','5 réceptions avec directions imprévisibles'],['Passe précise','Un partenaire lance, l’autre renvoie à dix doigts. Alterner les rôles.','3 renvois attrapables','5 renvois attrapables','8 renvois sans déplacement du lanceur'],['Record de passes','Face à face, réaliser des passes hautes.','5 échanges avec blocage intermédiaire autorisé','5 passes consécutives sans blocage','15 passes consécutives sans blocage'],['Passe en mouvement','Le lanceur varie la direction ; le joueur se place et renvoie à dix doigts.','3 renvois après déplacement latéral','5 renvois avec directions variées','8 renvois avec directions imprévisibles'],['Manchette','Un partenaire lance en cloche, l’autre renvoie en manchette. Alterner.','3 renvois attrapables','5 renvois précis','8 renvois précis avec déplacement']];
const initial=()=>({classes:[{id:'c1',name:'Classe démo',students:Array.from({length:6},(_,i)=>({id:'s'+i,name:'Élève '+(i+1)}))}],activities:[{id:'a1',name:'Volley-ball',classIds:['c1'],challenges:seed.map((x,i)=>({id:'d'+i,name:x[0],instruction:x[1],levels:x.slice(2),format:"duo"}))}],events:[]});
let db;try{db=JSON.parse(localStorage.getItem('epschallenge-v1'))||initial()}catch{db=initial()};migrateAssistance(db);let cls='',act='',student='',coach='',challenge='',partner='',level=0,tab='validate',msg='',screen='classes',adminTab='classes',pin=db.pin||'';
// Les anciennes validations sans preuve de coaching restent non renseignées.
function migrateAssistance(data){let modes=['coach','peer','solo','unknown'];let coached=new Set(data.events.filter(e=>e.role==='coach').map(e=>JSON.stringify([e.cls,e.act,e.challenge,e.group])));for(let e of data.events)if(e.role==='player'&&!modes.includes(e.assistance))e.assistance=coached.has(JSON.stringify([e.cls,e.act,e.challenge,e.group]))?'coach':'unknown'}
function challengeFormat(d){return d?.format==='duo'||d?.format==='solo'?d.format:seed.some(x=>x[0]===d?.name&&x[1]===d?.instruction)?'duo':'solo'}
function formatSelect(id,value){return `<select class="format-select" id="${id}"><option value="solo" ${value==='solo'?'selected':''}>1 joueur · validation individuelle</option><option value="duo" ${value==='duo'?'selected':''}>2 joueurs · validation en binôme</option></select>`}
function save(){try{localStorage.setItem('epschallenge-v1',JSON.stringify(db));return true}catch{return false}}
const C=()=>db.classes.find(x=>x.id===cls), A=()=>db.activities.find(x=>x.id===act), E=()=>db.events.filter(x=>x.cls===cls&&x.act===act), best=(s,d,role)=>Math.max(0,...E().filter(e=>e.student===s&&e.challenge===d&&e.role===role).map(e=>e.level));
// null = toutes les classes (y compris futures) ; [] = banque sans classe.
const targets=d=>Array.isArray(d.classIds)?d.classIds:d.classIds===null?null:d.classId?[d.classId]:null;
const assigned=(d,c)=>!!c&&(targets(d)===null||targets(d).includes(c));
const activityAvailable=(a,c)=>!!a&&assigned(a,c);
const challengeCollator=new Intl.Collator('fr',{numeric:true,sensitivity:'base'});
const sortedChallenges=ds=>[...ds].sort((a,b)=>challengeCollator.compare(a.name,b.name));
const available=(a,c)=>activityAvailable(a,c)?sortedChallenges((a.challenges||[]).filter(d=>assigned(d,c))):[];
const activitiesFor=c=>db.activities.filter(a=>activityAvailable(a,c));
function targetLabel(d){let t=targets(d);return t===null?'Toutes les classes':t.length?t.map(id=>db.classes.find(c=>c.id===id)?.name||'Classe inconnue').join(' · '):'Non attribué'}
function targetBox(id,t,kind='défi'){return `<div class="target-box" id="${id}"><label><input type="checkbox" data-all ${t===null?'checked':''} onchange="toggleAll('${id}')"> Toutes les classes (même futures)</label><div class="target-options">${db.classes.map(c=>`<label><input type="checkbox" data-class value="${esc(c.id)}" ${t!==null&&t.includes(c.id)?'checked':''} ${t===null?'disabled':''}> ${esc(c.name)}</label>`).join('')||'<small>Aucune classe créée.</small>'}</div><p class="muted">Cochez une ou plusieurs classes. Sans sélection, ${kind==='activité'?'l’activité reste sans classe.':'le défi reste dans la banque.'}</p></div>`}
function toggleAll(id){let box=$(id),all=box.querySelector('[data-all]').checked;box.querySelectorAll('[data-class]').forEach(x=>x.disabled=all)}
function readTargets(id){let box=$(id);return box.querySelector('[data-all]').checked?null:[...box.querySelectorAll('[data-class]:checked')].map(x=>x.value)}
function setTargets(d,t){d.classIds=t;delete d.classId}
function challengeCard(d,active){return `<div class="challenge-row"><div class="row"><div style="flex:1;min-width:130px"><strong>${esc(d.name)}</strong><br><small>${esc(targetLabel(d))} · ${challengeFormat(d)==='duo'?'2 joueurs':'1 joueur'}</small></div>${!active&&cls?`<button class="primary small" onclick="quickAdd('${d.id}')">+ Ajouter à ${esc(C()?.name)}</button>`:''}</div><details><summary>Consignes, format et classes destinataires</summary><p>${esc(d.instruction)}</p><label>Format de validation</label>${formatSelect('format-'+d.id,challengeFormat(d))}<button class="small" onclick="changeFormat('${d.id}')">Enregistrer le format</button>${d.levels.map((l,j)=>`<p>${medals[j+1]} : ${esc(l)}</p>`).join('')}${targetBox('target-'+d.id,targets(d))}<button class="small" onclick="changeTarget('${d.id}')">Enregistrer les classes</button><p id="notice-${d.id}" role="status" class="danger"></p></details></div>`}

const score=(s,role)=> available(A(),cls).reduce((sum,d)=>sum+best(s,d.id,role)*(role==='coach'?2:1),0);
const opts=(arr,v,placeholder)=>`<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('');
function select(id,arr,v,p){return `<select id="${id}">${opts(arr,v,p)}</select>`}function bind(id,fn){if($(id))$(id).onchange=e=>fn(e.target.value)}function go(t){tab=t;msg='';render()}
// Le rôle automatique est calculé sur les médailles obtenues AVANT la validation.
function autoCoach(d,players,n){if(!d||![1,2,3].includes(n)||players.length!==2)return '';return players.find(p=>best(p,d.id,'player')===3&&players.some(q=>q!==p&&best(q,d.id,'player')<n))||''}
function studentOptions(arr,v,placeholder,d){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''} ${d&&best(x.id,d.id,'player')===3?'style="color:#5b2794;font-weight:bold"':''}>${esc(x.name)}${d&&best(x.id,d.id,'player')===3?' · Super-coach':''}</option>`).join('')}
function challengeOptions(ds,s,v){return `<select id="challenge"><option value="">Choisir le défi</option>${ds.map(d=>`<option value="${esc(d.id)}" ${d.id===v?'selected':''}>${esc(d.name)}${best(s,d.id,'player')?' · '+medals[best(s,d.id,'player')]:''}</option>`).join('')}</select>`}
function previousMedals(s,d){return `<div class="previous-medals"><span>Ma médaille joueur : <strong>${medals[best(s,d.id,'player')]}</strong></span><span>Ma médaille coach : <strong>${medals[best(s,d.id,'coach')]}</strong></span>${best(s,d.id,'player')===3?'<b class="coach-mark">★ Super-coach sur ce défi</b>':''}</div>`}
function coachCount(s){return available(A(),cls).filter(d=>best(s,d.id,'player')===3).length}
function coachProfile(s){let n=coachCount(s);return n?`<p><span class="coach-mark">★ Super-coach sur ${n} défi${n>1?'s':''}</span></p>`:''}
function render(){let c=C(),a=A(),students=c?.students||[],ds=available(a,cls);if(!students.some(x=>x.id===student))student='';if(!students.some(x=>x.id===coach))coach='';if(!students.some(x=>x.id===partner)||partner===student)partner='';if(!ds.some(x=>x.id===challenge))challenge='';let d=ds.find(x=>x.id===challenge);let html='';
if(screen==='classes'){ $('app').innerHTML=`<section class="panel"><div class="row"><h2 style="flex:1;margin:0">Choisir ma classe</h2><button onclick="enterAdmin()">⚙ Espace enseignant</button></div><p class="muted">Sélectionnez votre classe pour commencer.</p><div class="grid">${db.classes.map(x=>`<button class="tile" onclick="chooseClass('${x.id}')"><strong>${esc(x.name)}</strong><small>${x.students.length} élèves</small></button>`).join('')||'<p>Aucune classe. Créez-en une dans l’espace enseignant.</p>'}</div></section>`;return;}
if(screen==='activities'){ $('app').innerHTML=`<section class="panel"><button onclick="home()">← Classes</button><h2 style="margin-top:18px">${esc(c?.name)} · Choisir mon activité</h2><div class="grid">${activitiesFor(cls).map(x=>`<button class="tile" onclick="chooseActivity('${x.id}')"><strong>${esc(x.name)}</strong><small>${available(x,cls).length} défis</small></button>`).join('')||'<p>Aucune activité disponible.</p>'}</div></section>`;return;}
if(screen==='admin'){renderAdmin();return;}
html=`<section class="panel"><div class="row"><button onclick="activities()">← Activités</button><strong>${esc(c?.name)} / ${esc(a?.name)}</strong></div><nav>${[['validate','Valider un défi'],['results','Mes résultats'],['book','Livret']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')}</nav></section>`;
if(tab==='validate'){
let duo=challengeFormat(d)==='duo', previous=d&&student?best(student,d.id,'player'):0, otherBest=d&&partner?best(partner,d.id,'player'):0;
let players=student?[student,...(duo&&partner?[partner]:[])]:[], canChoose=n=>!!(d&&student&&(!duo||partner)&&players.some(p=>best(p,d.id,'player')<n));
let automatic=autoCoach(d,players,level);
let eligible=level&&canChoose(level)?students.filter(x=>best(x.id,d.id,'player')===3&&players.some(p=>p!==x.id&&best(p,d.id,'player')<level)):[];
if(automatic)coach=automatic;else if(!eligible.some(x=>x.id===coach))coach='';
let ready=canChoose(level)&&[1,2,3].includes(level);
html+=`<section class="panel"><h2>Valider un défi</h2><label for="student">Je suis</label>${select('student',students,student,'Choisir mon nom')}${student?`<label for="challenge">Défi</label>${challengeOptions(ds,student,challenge)}`:''}${student&&d?`<p class="challenge-instruction">${esc(d.instruction)}</p>${previousMedals(student,d)}${duo?`<label for="partner">Mon partenaire</label><select id="partner">${studentOptions(students.filter(x=>x.id!==student),partner,'Choisir mon partenaire',d)}</select>${partner?`<div class="previous-medals"><span>Médaille du partenaire : <strong>${medals[otherBest]}</strong></span>${otherBest===3?'<b class="coach-mark">★ Super-coach</b>':''}</div>`:''}`:''}${!duo||partner?`<label>Niveau réussi</label><div class="medal-options">${[1,2,3].map(n=>`<button type="button" class="medal-option ${level===n?'active':''} ${previous===n?'earned':''}" aria-pressed="${level===n}" ${!canChoose(n)?'disabled':''} onclick="pickLevel(${n})"><strong>${medals[n]}</strong><span class="criterion">${esc(d.levels[n-1])}${previous===n?' <small>· Ma médaille actuelle</small>':''}</span><span class="indicator" aria-hidden="true">${level===n?'✓':!canChoose(n)?'✓':'○'}</span></button>`).join('')}</div>${ready?(automatic?`<div class="coach-note"><span class="coach-mark">★ Super-coach automatique</span><p style="margin:8px 0 0"><strong>${esc(students.find(x=>x.id===automatic)?.name)}</strong> accompagne son partenaire.</p></div>`:eligible.length?`<label class="validation-label" for="coach">Super-coach <small>Facultatif</small></label><select id="coach">${studentOptions(eligible,coach,'Sans super-coach',d)}</select>${coach?'<p class="coach-mark">★ Super-coach sélectionné</p>':''}`:''):''}`:''}<button class="primary validation-action" onclick="validate()" ${!ready?'disabled':''}>Valider la réussite</button>`:''}${msg?`<p class="validation-error" role="alert">${esc(msg)}</p>`:''}</section>`;

const assistanceModes=['coach','peer','solo','unknown'];
const assistanceLabels=['Avec super-coach','Avec camarade (sans super-coach)','Seul (sans super-coach)','Non renseigné (ancien)'];
function assistanceStats(s,history=false){let ds=new Set(available(A(),cls).map(d=>d.id)),events=E().filter(e=>e.student===s&&e.role==='player'&&ds.has(e.challenge)),latest=new Map();for(let e of events){if(!latest.has(e.challenge)||latest.get(e.challenge).level<e.level)latest.set(e.challenge,e)}let counts=Object.fromEntries(assistanceModes.map(m=>[m,[0,0,0,0]]));for(let e of history?events:latest.values()){let m=assistanceModes.includes(e.assistance)?e.assistance:'unknown';counts[m][e.level]++}return counts}
function assistanceTotal(c,m){return c[m].reduce((a,b)=>a+b,0)}
function assistanceCell(c,m){let a=c[m];return `<strong>${assistanceTotal(c,m)}</strong><br><small>🥉 ${a[1]} · 🥈 ${a[2]} · 🥇 ${a[3]}</small>`}
function assistanceTable(students,history=false){return `<div class="scroll"><table><tr><th>Élève</th>${assistanceLabels.map(x=>`<th>${x}</th>`).join('')}</tr>${students.map(s=>{let c=assistanceStats(s.id,history);return `<tr><td>${esc(s.name)}</td>${assistanceModes.map(m=>`<td>${assistanceCell(c,m)}</td>`).join('')}</tr>`}).join('')}</table></div>`}

function progress(s){let ds=available(A(),cls),n=ds.length,pct=v=>n?Math.round(100*v/n):0;return `<div class="progress-grid">${['player','coach'].map(role=>{let counts=[0,0,0,0];for(let d of ds)counts[best(s,d.id,role)]++;let done=n-counts[0];return `<div class="progress-card"><h3>${role==='player'?'Joueur':'Super-coach'} · ${pct(done)} % des défis</h3><p>${done} / ${n} défis validés</p><div class="progress-track" role="img" aria-label="${pct(done)} %"><div style="width:${pct(done)}%"></div></div><div class="medal-breakdown">${[1,2,3].map(i=>`<span>${medals[i]} : <strong>${counts[i]} (${pct(counts[i])} %)</strong></span>`).join('')}<span>Non validés : ${counts[0]} (${pct(counts[0])} %)</span></div></div>`}).join('')}</div><small>Pourcentages calculés sur les défis de la classe dans cette APSA.</small>`}
function sessionDay(date){if(!date)return '';let d=new Date(date);if(!Number.isFinite(d.getTime()))return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function timelineData(s){let allowed=new Set(available(A(),cls).map(d=>d.id)),events=E().filter(e=>allowed.has(e.challenge)),days=[...new Set(events.map(e=>sessionDay(e.date)).filter(Boolean))].sort(),bests=new Map(),p=0,c=0;function ingest(e){if(e.student!==s)return;let k=e.challenge+'|'+e.role,old=bests.get(k)||0;if(e.level<=old)return;bests.set(k,e.level);if(e.role==='player')p+=e.level-old;else c+=2*(e.level-old)}events.filter(e=>!sessionDay(e.date)).forEach(ingest);let rows=[];if(p||c)rows.push({day:'',p,c,dp:p,dc:c});for(let day of days){let bp=p,bc=c;events.filter(e=>sessionDay(e.date)===day).forEach(ingest);rows.push({day,p,c,dp:p-bp,dc:c-bc})}return rows}
function timeline(s){let rows=timelineData(s);if(!rows.length)return '<div class="timeline"><h3>Évolution de mes points</h3><p class="muted">Tes progrès apparaîtront après les premières validations.</p></div>';let max=Math.max(1,...rows.map(r=>r.p+r.c)),w=620,h=240,x0=45,x1=602,y0=198,y1=17,x=i=>rows.length===1?(x0+x1)/2:x0+i*(x1-x0)/(rows.length-1),y=v=>y0-v/max*(y0-y1),colors=['#176b79','#7838a5','#223b57'],series=[r=>r.p,r=>r.c,r=>r.p+r.c],ticks=[...new Set([0,Math.round(max/2),max])];let plot=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution cumulative des points joueur, super-coach et total">${ticks.map(t=>`<line x1="${x0}" y1="${y(t)}" x2="${x1}" y2="${y(t)}" stroke="#dce4eb"/><text x="${x0-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="#526779">${t}</text>`).join('')}${series.map((f,k)=>`<polyline points="${rows.map((r,i)=>`${x(i)},${y(f(r))}`).join(' ')}" fill="none" stroke="${colors[k]}" stroke-width="${k===2?3:2.5}" ${k===2?'stroke-dasharray="6 4"':''}/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(f(r))}" r="3" fill="${colors[k]}"><title>${f(r)} points</title></circle>`).join('')}`).join('')}${rows.map((r,i)=>i===0||i===rows.length-1||rows.length<=6?`<text x="${x(i)}" y="220" font-size="11" text-anchor="${rows.length===1?'middle':i===0?'start':i===rows.length-1?'end':'middle'}" fill="#526779">${r.day?r.day.slice(8)+'/'+r.day.slice(5,7):'Ancien'}</text>`:'').join('')}</svg>`;return `<div class="timeline"><h3>Évolution de mes points</h3><small>Une séance correspond à une date avec des validations dans la classe.</small><div class="legend">${['Joueur','Super-coach','Total'].map((n,i)=>`<span><i style="background:${colors[i]}"></i>${n}</span>`).join('')}</div>${plot}<div class="scroll"><table><thead><tr><th>Séance</th><th>Joueur</th><th>Coach</th><th>Total cumulé</th><th>Gain</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r.day?r.day.split('-').reverse().join('/'):'Ancien · date inconnue'}</td><td>${r.p}</td><td>${r.c}</td><td><strong>${r.p+r.c}</strong></td><td class="gain">+${r.dp+r.dc}</td></tr>`).join('')}</tbody></table></div></div>`}
function validate(){let students=C()?.students||[],valid=s=>students.some(x=>x.id===s),d=available(A(),cls).find(x=>x.id===challenge);if(!valid(student)||!d||![1,2,3].includes(level))return;let duo=challengeFormat(d)==='duo';if(duo&&(!valid(partner)||partner===student)){msg='Choisissez un partenaire.';return render()}let players=[student,...(duo?[partner]:[])],improving=players.filter(p=>best(p,d.id,'player')<level);if(!improving.length)return render();let automatic=autoCoach(d,players,level);if(automatic)coach=automatic;if(coach&&(!valid(coach)||best(coach,d.id,'player')!==3||!improving.some(p=>p!==coach))){msg='Choisissez un super-coach ayant déjà obtenu l’or sur ce défi.';return render()}let participants=[...new Set([...players,...(coach?[coach]:[])])],before=new Map(participants.map(s=>[s,{p:score(s,'player'),c:score(s,'coach')}])),group=uid(),earned=[],previousEventCount=db.events.length;let event=(s,r)=>{if(best(s,challenge,r)>=level)return;db.events.push({id:uid(),group,cls,act,student:s,challenge,level,role:r,...(r==='player'?{assistance:coach?'coach':duo?'peer':'solo'}:{}),date:new Date().toISOString()});earned.push(`${students.find(x=>x.id===s).name} · ${medals[level]}${r==='coach'?' (super-coach)':''}`)};improving.forEach(p=>event(p,'player'));if(coach)event(coach,'coach');let ok=save();if(!ok){db.events.length=previousEventCount;msg='La réussite n’a pas pu être enregistrée. Préviens ton enseignant et réessaie.';render();return}msg='';level=0;coach='';render();showConfirmation(participants,before,d,group)}
function showConfirmation(participants,before,d,group){let students=C()?.students||[],events=E().filter(e=>e.group===group);$('confirmationDetails').innerHTML=participants.map(s=>{let p=score(s,'player'),c=score(s,'coach'),old=before.get(s),dp=p-old.p,dc=c-old.c,changes=events.filter(e=>e.student===s),result=changes.length?changes.map(e=>`${medals[e.level]} · ${e.role==='coach'?'Super-coach':'Joueur'} (+${e.role==='coach'?dc:dp} pt${(e.role==='coach'?dc:dp)>1?'s':''})`).join(' / '):`Médaille joueur : ${medals[best(s,d.id,'player')]} · Aucun nouveau point`;return `<section class="confirmation-person"><div class="row"><h3>${esc(students.find(x=>x.id===s)?.name)}</h3><span class="gain-chip">+${dp+dc} pt${dp+dc>1?'s':''}</span></div><div class="result-line">${esc(result)}</div>${best(s,d.id,'player')===3?'<span class="coach-mark">★ Super-coach sur ce défi</span>':''}<div class="grid">${stats(s)}</div>${progress(s)}<details><summary>Évolution de mes points par séance</summary>${timeline(s)}</details></section>`}).join('');$('validationConfirmation').showModal();$('validationConfirmation').scrollTop=0;$('confirmationDone').focus({preventScroll:true})}

function removeStudent(id){let c=C();if(!c||!c.students.some(s=>s.id===id))return;c.students=c.students.filter(s=>s.id!==id);db.events=db.events.filter(e=>!(e.cls===cls&&e.student===id));let ok=save();msg='Élève supprimé.'+(ok?'':' Sauvegarde locale indisponible.');render()}
function addClass(){let name=$('newclass').value.trim();if(!name){$('classnotice').textContent='Indiquez le nom de la classe.';return;}if(db.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){$('classnotice').textContent='Cette classe existe déjà.';return;}let names=[...new Set($('newnames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];cls=uid();db.classes.push({id:cls,name,students:names.map(name=>({id:uid(),name}))});let ok=save();msg=`Classe ${name} créée avec ${names.length} élève(s).`+(ok?'':' Sauvegarde locale indisponible : exportez une sauvegarde JSON.');render()}function addStudents(){let c=C();if(!c)return;for(let name of $('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean))if(!c.students.some(s=>s.name===name))c.students.push({id:uid(),name});save();render()}function addActivity(){let name=$('newactivity').value.trim();if(!name||db.activities.some(a=>a.name.toLowerCase()===name.toLowerCase())){$('newactivitynotice').textContent='Indiquez un nom d’activité unique.';return;}act=uid();db.activities.push({id:act,name,challenges:[],classIds:readTargets('newactivitytargets')});let ok=save();msg='Activité créée.'+(ok?'':' Sauvegarde locale indisponible.');render()}

function quickActivity(){let a=A();if(!a||!C()||assigned(a,cls))return;setTargets(a,[...new Set([...(targets(a)||[]),cls])]);let ok=save();msg='APSA attribuée à '+C().name+'.'+(ok?'':' Sauvegarde locale indisponible.');render()}function addChallenge(){let a=A();if(!a)return;let name=$('dn').value.trim(),instruction=$('di').value.trim(),levels=[1,2,3].map(n=>$('dl'+n).value.trim());let missing=[['dn','nom du défi',name],['di','consigne',instruction],...levels.map((v,i)=>['dl'+(i+1),['critère bronze','critère argent','critère or'][i],v])].filter(x=>!x[2]);if(missing.length){$('createnotice').textContent='À compléter : '+missing.map(x=>x[1]).join(', ')+'.';$(missing[0][0]).focus();return;}let d={id:uid(),name,instruction,levels,format:$('newformat').value,classIds:readTargets('newtargets')};a.challenges.push(d);let hidden=db.classes.filter(c=>assigned(d,c.id)&&!activityAvailable(a,c.id));let ok=save();msg='Défi créé · '+targetLabel(d)+(hidden.length?' · Pour rendre le défi visible, attribuez aussi cette APSA à : '+hidden.map(c=>c.name).join(', ')+'.':'')+(ok?'':' · Sauvegarde locale indisponible.');render()}

function quickAdd(id){let d=A()?.challenges.find(x=>x.id===id);if(!d||!C()||!activityAvailable(A(),cls)||assigned(d,cls))return;setTargets(d,[...new Set([...(targets(d)||[]),cls])]);let ok=save();msg='Défi ajouté à '+C().name+'.'+(ok?'':' Sauvegarde locale indisponible.');render()}
function changeTarget(id){let d=A()?.challenges.find(x=>x.id===id);if(!d)return;let t=readTargets('target-'+id);if(t!==null&&db.events.some(e=>e.act===act&&e.challenge===id&&!t.includes(e.cls))){$('notice-'+id).textContent='Impossible de retirer une classe ayant déjà des validations pour ce défi.';return;}setTargets(d,t);let ok=save();msg='Classes destinataires enregistrées.'+(ok?'':' Sauvegarde locale indisponible.');render()}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('eps-challenge-sauvegarde.json',JSON.stringify(db,null,2),'application/json')}function csv(){let q=x=>'"'+String(x).replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';let rows=[['Classe','APSA','Élève','Points joueur','Points coach','Total',...assistanceLabels.map(x=>'Meilleure médaille · '+x),...assistanceLabels.map(x=>'Historique · '+x)],...(C()?.students||[]).map(s=>{let bestCounts=assistanceStats(s.id),historyCounts=assistanceStats(s.id,true);return [C().name,A()?.name,s.name,score(s.id,'player'),score(s.id,'coach'),score(s.id,'player')+score(s.id,'coach'),...assistanceModes.map(m=>assistanceTotal(bestCounts,m)),...assistanceModes.map(m=>assistanceTotal(historyCounts,m))]})];download('eps-resultats.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function undo(id){let e=db.events.find(x=>x.id===id);if(!e||!confirm('Annuler cette validation et sa validation associée ? Les validations de ce défi postérieures seront également annulées pour préserver la cohérence.'))return;let i=db.events.indexOf(e);let first=db.events.findIndex(x=>x.group===e.group);db.events=db.events.filter((x,j)=>!(j>=first&&x.cls===e.cls&&x.act===e.act&&x.challenge===e.challenge));save();render()}
async function restore(e){try{let x=JSON.parse(await e.target.files[0].text());let validId=v=>typeof v==='string'&&/^[a-zA-Z0-9]+$/.test(v);if(!Array.isArray(x.classes)||!Array.isArray(x.activities)||!Array.isArray(x.events)||!x.classes.every(c=>validId(c.id)&&typeof c.name==='string'&&Array.isArray(c.students)&&c.students.every(s=>validId(s.id)&&typeof s.name==='string'))||!x.activities.every(a=>validId(a.id)&&typeof a.name==='string'&&(a.classIds===undefined||a.classIds===null||(Array.isArray(a.classIds)&&a.classIds.every(id=>x.classes.some(c=>c.id===id))&&new Set(a.classIds).size===a.classIds.length))&&Array.isArray(a.challenges)&&a.challenges.every(d=>validId(d.id)&&typeof d.name==='string'&&typeof d.instruction==='string'&&(d.format===undefined||['solo','duo'].includes(d.format))&&(d.classIds===undefined?(!d.classId||x.classes.some(c=>c.id===d.classId)):d.classIds===null||(Array.isArray(d.classIds)&&d.classIds.every(id=>x.classes.some(c=>c.id===id))&&new Set(d.classIds).size===d.classIds.length))&&Array.isArray(d.levels)&&d.levels.length===3&&d.levels.every(l=>typeof l==='string')))||!x.events.every(z=>validId(z.id)&&validId(z.group)&&[1,2,3].includes(z.level)&&['player','coach'].includes(z.role)&&x.classes.some(c=>c.id===z.cls&&c.students.some(s=>s.id===z.student))&&x.activities.some(a=>a.id===z.act&&a.challenges.some(d=>d.id===z.challenge))))throw Error();if(!confirm('Remplacer toutes les données ?'))return;db=x;migrateAssistance(db);delete db.pin;cls=db.classes[0]?.id;act=db.activities[0]?.id;student=coach=partner=challenge='';save();render()}catch{alert('Fichier de sauvegarde invalide.')}}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=2.11').catch(()=>{});
